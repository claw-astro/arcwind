# =========================================================================
# Elias 2-20 (DSHARP 12CO 2-1): one-sided red-shifted wind, only the far half
# of each ring detected (the near half falls in the cloud-absorbed range).
# Adopted model: cone + smoothly broken power law, flow along the cone wall.
#
#   diskwind check elias20.toml
#   diskwind run elias20.toml          (or examples/02_elias20_analysis.py)
# =========================================================================

[source]
fits_file = "Elias20_CO.fits"
name = "Elias 2-20"
distance_pc = 137.5
mstar_msun = 0.75
inclination_deg = 49.0
disk_pa_deg = 153.2
wind_pa_deg = 243.2
wind_approaching = false
disk_rotation_sense = 1
vsys_kms = 1.9
vsys_err_kms = 0.1
vsys_aperture_arcsec = 1.5
# Disk center: ellipse fit to the continuum (Huang et al. 2018, DSHARP II, Table 1:
# dRA = -54.4 +/- 1.5 mas, dDec = -491.0 +/- 1.3 mas from the phase center, which
# is the reference pixel of the DSHARP images). To fit it yourself instead, set
# center_from_continuum = true and center_offset_arcsec = [0.0, 0.0], or run
# `diskwind center Elias20_continuum.fits` and paste its output here.
center_ra = "auto"
center_dec = "auto"
center_offset_arcsec = [-0.0544, -0.491]
continuum_fits = "Elias20_continuum.fits"
center_from_continuum = false
restfreq_hz = 230538000000.0

[grid]
x_half_width_arcsec = 3.0
y_range_arcsec = [-1.5, 4.0]
step_arcsec = "auto"
v_range_kms = [-12.0, 18.0]
units = "mJy/beam"

[noise]
n_edge_channels = 5
# The last channel of the cube is blank (excluded automatically) and the red end
# lies close to the wind; to use only line-free blue-end channels instead:
#   vel_ranges_kms = [[-7.0, -4.5]]
vel_ranges_kms = "auto"
rms_jy_beam = "auto"

[cuts]
y_offsets_arcsec = {start = 0.35, stop = 2.45, step = 0.15}
slit_width_arcsec = "auto"

[cuts.overrides."2.00"]
"mask.x_range_arcsec" = [-1.8, 1.8]
"mask.vrel_range_kms" = [4.8, 12.1]
"cuts.slit_width_arcsec" = 0.1
"trace.snr_min" = 2.5
"trace.xsmooth_arcsec" = 0.1
"trace.vsmooth_chan" = 2
"trace.guide_dv_kms" = [1.0, 2.5]

[cuts.overrides."2.15"]
"mask.x_range_arcsec" = [-1.8, 1.8]
"mask.vrel_range_kms" = [4.8, 12.1]
"cuts.slit_width_arcsec" = 0.12
"trace.snr_min" = 2.5
"trace.xsmooth_arcsec" = 0.12
"trace.vsmooth_chan" = 2
"trace.guide_dv_kms" = [1.0, 2.5]

[cuts.overrides."2.30"]
"mask.x_range_arcsec" = [-1.9, 1.9]
"mask.vrel_range_kms" = [4.8, 12.1]
"cuts.slit_width_arcsec" = 0.15
"trace.snr_min" = 2.5
"trace.xsmooth_arcsec" = 0.15
"trace.vsmooth_chan" = 2
"trace.guide_dv_kms" = [1.0, 2.5]

[cuts.overrides."2.45"]
"mask.x_range_arcsec" = [-1.9, 1.9]
"mask.vrel_range_kms" = [4.8, 12.1]
"cuts.slit_width_arcsec" = 0.15
"trace.snr_min" = 2.5
"trace.xsmooth_arcsec" = 0.15
"trace.vsmooth_chan" = 2
"trace.guide_dv_kms" = [1.0, 2.5]

[mask]
vrel_range_kms = [4.1, 12.1]
v_exclude_kms = []
x_range_arcsec = "auto"
x_cone = [0.19, 0.27, 0.54, -0.14]
x_max_arcsec = 2.5
kepler = true
kepler_dv_kms = 0.8
disk_rout_au = 250.0
disk_z_over_r = 0.35

[trace]
mode = "single"
snr_min = 3.0                 # lowered by 1 (was 4.0; top-cut overrides 3.5 -> 2.5) to keep more points
fit_frac = 0.3
err_inflate = 2.0
dx_arcsec = "auto"
min_points = 8
sigx_beam = 0.5
drop_clipped = false
guide_dv_kms = 1.0
peak_choice = "nearest"
xsmooth_arcsec = "auto"
vsmooth_chan = "auto"

[fit]
velocity_law = "broken-power-law"
radial = "cone"
rotation = "constant"
fixed = {}
bounds = {}
equal_cut_weight = true
loss = "soft_l1"
n_boot = 100
check_vr_sign = true
scale_errors_by_chi2 = true
zref_au = 100.0
bpl_delta = 0.1
iterations = 1
j_multistart = true
max_nfev = 3000
nphi = 361
seed = 42

[ring]
rotation_law = "j"
cone_half_angle_deg = "auto"
n_passes = 2
n_mc = 1000
min_phi_coverage = 0.25
cone_fit_zrange_au = [0.0, "inf"]
prior_sigma_kms = 0.5

[mass]
tex_k = 30.0
tex_range_k = [20.0, 50.0]
xco = 0.0001
mu = 1.4
dz_au = 30.0
nsigma = 5.0
flux_cal = 0.1
nmc = 1000
y_range_arcsec = "auto"
nu_hz = 230538000000.0
a_ul = 6.91e-07
g_up = 5.0
e_up_k = 16.596
b_rot_hz = 57635968000.0

[output]
dir = "diskwind_output_elias20"
fig_format = "pdf"
dpi = 200
verbose = true

[plot]
xlim = [2.0, -2.0]
vlim = [-8, 15]
contour_start_sigma = 5.0
contour_step_sigma = 5.0
cmap = "magma"
mom0_fits = "Elias20_CO_M0.fits"     # slit-layout map (auto: integrated from the cube)
map_cmap = "cmr.freeze"              # needs `pip install cmasher`
line_label = "$^{12}$CO $J$=2$-$1"
map_min = 64.0
continuum_min = 0.11
pv_grid_offsets_arcsec = {start = -1.2, stop = 3.0, step = 0.3}
ncols = 4
