[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diskwind"
dynamic = ["version"]
description = "Geometry and kinematics of protoplanetary disk winds from transverse position-velocity diagrams"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Charles J. Law"}]
keywords = ["astronomy", "protoplanetary disks", "disk winds", "ALMA", "kinematics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["numpy>=1.21", "scipy>=1.7", "matplotlib>=3.5", "tomli>=1.1; python_version<'3.11'"]

[project.optional-dependencies]
fits = ["astropy>=5"]
yaml = ["pyyaml>=6"]
docs = ["sphinx>=7", "furo", "numpydoc"]
test = ["pytest>=7"]
all = ["astropy>=5", "pyyaml>=6", "cmasher"]

[project.scripts]
diskwind = "diskwind.cli:main"

[project.urls]
Documentation = "https://diskwind.readthedocs.io"

[tool.setuptools.dynamic]
version = {attr = "diskwind._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
diskwind = ["data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--doctest-modules --doctest-glob='*.rst' -p no:cacheprovider"
doctest_optionflags = ["ELLIPSIS", "NORMALIZE_WHITESPACE", "NUMBER"]
